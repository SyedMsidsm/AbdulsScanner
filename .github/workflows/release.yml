name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Keystore Secrets and Build
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/v}"
          echo "Building for version $VERSION_TAG"
          
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret is not configured. Building debug APK as fallback."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "AbdulsScanner-${VERSION_TAG}-debug.apk"
            echo "apk_path=AbdulsScanner-${VERSION_TAG}-debug.apk" >> $GITHUB_OUTPUT
            echo "is_signed=false" >> $GITHUB_OUTPUT
          else
            echo "Keystore secret found. Decoding keystore..."
            KEYSTORE_FILE="/tmp/abdulsscanner-release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            
            export RELEASE_STORE_FILE="$KEYSTORE_FILE"
            export RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            
            ./gradlew assembleRelease
            rm -f "$KEYSTORE_FILE"
            
            cp app/build/outputs/apk/release/app-release.apk "AbdulsScanner-${VERSION_TAG}.apk"
            echo "apk_path=AbdulsScanner-${VERSION_TAG}.apk" >> $GITHUB_OUTPUT
            echo "is_signed=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract Release Notes from CHANGELOG.md
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Try to extract the section for this tag from CHANGELOG.md
          NOTE=$(sed -n "/## \[${TAG_NAME}\]/,/## \[/p" CHANGELOG.md | sed '$d' || true)
          if [ -z "$NOTE" ]; then
            NOTE="Release $TAG_NAME"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build_apk.outputs.apk_path }}
          body: ${{ steps.release_notes.outputs.notes }}
          name: "Abdul's Scanner ${{ github.ref_name }}"
          draft: false
          prerelease: false
